<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Transition Overlay</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.4/socket.io.min.js"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background: transparent !important; /* Crucial for OBS Browser Source */
            overflow: hidden;
        }

        .transition-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .panel {
            position: absolute;
            top: -10%;
            height: 120%;
            width: 150%;
            transform: skewX(-20deg) translateX(-150%);
        }

        .panel-1 { background-color: var(--panel-color-1, #003884); z-index: 10; }
        .panel-2 { background-color: var(--panel-color-2, #ffffff); z-index: 11; }

        .logo-container {
            z-index: 12;
            opacity: 0;
            transform: scale(0.5);
        }

        .logo {
            max-width: 700px;
            max-height: 700px;
            filter: drop-shadow(0px 10px 15px rgba(0,0,0,0.5));
        }

        .animate .panel-1 { animation: slideIn 1.5s cubic-bezier(0.77, 0, 0.175, 1) forwards; }
        .animate .panel-2 { animation: slideIn 1.5s cubic-bezier(0.77, 0, 0.175, 1) 0.1s forwards; }
        .animate .logo-container { animation: popIn 1.5s cubic-bezier(0.77, 0, 0.175, 1) 0.2s forwards; }

        @keyframes slideIn {
            0% { transform: skewX(-20deg) translateX(-150%); }
            40%, 60% { transform: skewX(-20deg) translateX(0%); }
            100% { transform: skewX(-20deg) translateX(150%); }
        }

        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.5); }
            40% { opacity: 1; transform: scale(1.1); }
            50%, 60% { opacity: 1; transform: scale(1); }
            100% { opacity: 0; transform: scale(1.5); }
        }
    </style>
</head>
<body>
    <div class="transition-container" id="trans-container">
        <div class="panel panel-1"></div>
        <div class="panel panel-2"></div>

        <div class="logo-container">
            <img src="" alt="Team logo" class="logo" id="logo-img" style="display:none;">
        </div>
    </div>

    <script>
        const socket = io('/transition');
        const root = document.documentElement;
        const container = document.getElementById('trans-container');
        const logoImg = document.getElementById('logo-img');

        function applySettings(settings) {
            root.style.setProperty('--panel-color-1', settings.panel_color_1);
            root.style.setProperty('--panel-color-2', settings.panel_color_2);

            if (settings.logo_filename) {
                logoImg.src = `/transition/uploads/${settings.logo_filename}`;
                logoImg.style.display = '';
            } else {
                logoImg.removeAttribute('src');
                logoImg.style.display = 'none';
            }
        }

        function playTransition() {
            container.classList.remove('animate');
            void container.offsetWidth; // force reflow so the animation can restart
            container.classList.add('animate');
        }

        socket.on('settings_updated', applySettings);
        socket.on('play_transition', playTransition);
    </script>
</body>
</html>
